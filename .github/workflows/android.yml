name: Build Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trouver l'application
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouvé"
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf app
          mkdir app

          unzip -q "$ZIP" -d app

          echo "Contenu de app :"
          find app -maxdepth 3 -type f | head -100

      - name: Préparer l'application Web
        run: |
          mkdir -p web

          INDEX=$(find app -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "index.html introuvable"
            exit 1
          fi

          DIR=$(dirname "$INDEX")

          echo "Application trouvée dans : $DIR"

          cp -r "$DIR"/. web/

          echo "Contenu Web :"
          ls -la web

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configurer Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.academielafontaine.kindia',
            appName: 'Académie La Fontaine de Kindia',
            webDir: 'web'
          };

          export default config;
          EOF

      - name: Créer Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Academie-La-Fontaine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
